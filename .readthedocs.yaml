# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Read the Docs serves `stable` (highest release tag) and `latest` (master)
# only. Older versions are served by the GitHub Pages archive (DD-028).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/source/requirements.txt
    - method: pip
      path: .
